[build-system]
requires = ["setuptools>=61", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "learn_python"
version = "0.1.0"
description = "Python learning exercises"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "build",
    "Cython",
    "pytest",
    "setuptools",
]
